apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deployment
  namespace: devops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: website

  template:
    metadata:
      labels:
        app: website

    spec:
      containers:
      - name: website
        image: <your-dockerhub-username>/website:latest

        ports:
        - containerPort: 80
